{
   "apiVersion": "apps/v1",
   "kind": "Deployment",
   "metadata": {
      "labels": {
         "rubykaigi.org/app": "trapbridge"
      },
      "name": "trapbridge"
   },
   "spec": {
      "replicas": 2,
      "selector": {
         "matchLabels": {
            "rubykaigi.org/app": "trapbridge"
         }
      },
      "template": {
         "metadata": {
            "labels": {
               "rubykaigi.org/app": "trapbridge"
            }
         },
         "spec": {
            "containers": [
               {
                  "args": [
                     "server",
                     "--listen=0.0.0.0:162",
                     "--http-listen=0.0.0.0:10162",
                     "--mib-json=/config/mibs.json",
                     "--config=/config/config.json",
                     "--event-bus=default",
                     "--log-json"
                  ],
                  "env": [
                     {
                        "name": "AWS_REGION",
                        "value": "ap-northeast-1"
                     }
                  ],
                  "image": "ghcr.io/sorah/trapbridge:135bc9385eeacb279648517ae4c0b3324bf3344a",
                  "livenessProbe": {
                     "failureThreshold": 2,
                     "httpGet": {
                        "path": "/healthz",
                        "port": "http",
                        "scheme": "HTTP"
                     },
                     "periodSeconds": 3
                  },
                  "name": "trapbridge",
                  "ports": [
                     {
                        "containerPort": 162,
                        "name": "snmptrap",
                        "protocol": "UDP"
                     },
                     {
                        "containerPort": 10162,
                        "name": "http"
                     }
                  ],
                  "readinessProbe": {
                     "httpGet": {
                        "path": "/healthz",
                        "port": "http",
                        "scheme": "HTTP"
                     }
                  },
                  "resources": {
                     "requests": {
                        "cpu": "5m",
                        "memory": "32M"
                     }
                  },
                  "volumeMounts": [
                     {
                        "mountPath": "/config",
                        "name": "config"
                     }
                  ]
               }
            ],
            "serviceAccountName": "trapbridge",
            "topologySpreadConstraints": [
               {
                  "labelSelector": {
                     "matchLabels": {
                        "rubykaigi.org/app": "trapbridge"
                     }
                  },
                  "matchLabelKeys": [
                     "pod-template-hash"
                  ],
                  "maxSkew": 1,
                  "topologyKey": "topology.kubernetes.io/zone",
                  "whenUnsatisfiable": "DoNotSchedule"
               }
            ],
            "volumes": [
               {
                  "configMap": {
                     "name": "trapbridge-config"
                  },
                  "name": "config"
               }
            ]
         }
      }
   }
}
