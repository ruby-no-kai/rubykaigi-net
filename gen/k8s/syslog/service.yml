{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "fluentd"
  },
  "spec": {
    "ports": [
      {
        "name": "syslog",
        "port": 514,
        "protocol": "UDP",
        "targetPort": "syslog"
      }
    ],
    "selector": {
      "rubykaigi.org/app": "syslog-fluentd"
    },
    "type": "ClusterIP"
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "fluentd-forward"
  },
  "spec": {
    "ports": [
      {
        "name": "forward",
        "port": 24224,
        "protocol": "TCP",
        "targetPort": 24224
      }
    ],
    "selector": {
      "rubykaigi.org/app": "syslog-fluentd"
    },
    "type": "ClusterIP"
  }
}
---
